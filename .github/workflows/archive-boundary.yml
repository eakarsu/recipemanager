name: archive-boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-boundary.sh
      - run: python3 -m unittest runtime/test_runtime.py
      - uses: gitleaks/gitleaks-action@v2
